<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monthly C3S seasonal forecast anomaly maps and the average of the available forecasting centres.">
  <title>Seasonal Forecasts</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #303522; background: #fff7ce; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    main { max-width: 1500px; margin: auto; padding: 12px 32px 16px; }
    .masthead { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr); align-items: center; gap: 20px; padding-bottom: 12px; }
    .heading { text-align: center; min-width: 0; }
    .copernicus { width: 100%; max-width: 270px; height: auto; }
    .brand { width: 100%; max-width: 94px; height: auto; justify-self: end; }
    h1 { font-size: clamp(1.7rem, 3.6vw, 3rem); letter-spacing: -.035em; line-height: 1.1; margin: 0 0 8px; }
    .edition { margin: 0; color: #60613c; font-size: 1rem; line-height: 1.5; }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr); gap: 24px; align-items: end; padding: 12px 0; border-top: 1px solid #dace8d; }
    .field { display: grid; gap: 8px; min-width: 0; }
    .centre-field { justify-self: end; width: 100%; max-width: 340px; }
    label { font-size: .875rem; font-weight: 700; }
    select { width: 100%; max-width: 340px; padding: 13px 32px 13px 12px; font: inherit; color: inherit; border: 1px solid #a49c65; border-radius: 8px; background: #fffced; cursor: pointer; }
    .months { display: flex; gap: 12px; align-items: center; }
    button { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid #a49c65; border-radius: 50%; background: #fffced; color: #303522; cursor: pointer; }
    button:hover:enabled { background: #ece4a5; }
    button:disabled { opacity: .35; cursor: default; }
    button svg { width: 20px; height: 20px; }
    :focus-visible { outline: 3px solid #225b99; outline-offset: 4px; }
    .month-label { width: 174px; text-align: center; }
    #month { display: block; font-size: 1.2rem; font-weight: 700; }
    #position { display: block; margin-top: 5px; font-size: .875rem; color: #60613c; }
    figure { margin: 0; background: #fffdf0; border: 1px solid #dace8d; border-radius: 12px; overflow: hidden; }
    .map-area { position: relative; height: var(--map-height, 65vh); padding: 6px; }
    #map { display: block; width: 100%; height: 100%; object-fit: contain; }
    [hidden] { display: none !important; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 32px; text-align: center; line-height: 1.6; margin: 0; color: #60613c; overflow-wrap: anywhere; }
    figcaption { padding: 8px 16px; border-top: 1px solid #e5dba7; font-size: .875rem; line-height: 1.5; }
    noscript { display: block; padding: 20px; }
    @media (max-width: 960px) {
      .toolbar { gap: 12px; }
      .toolbar select { max-width: 260px; }
    }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .centre-field { grid-column: 2; grid-row: 1; }
      .months { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
      .toolbar select { max-width: none; }
    }
    @media (max-width: 640px) {
      main { padding: 12px 14px; }
      .masthead { gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr); }
      h1 { font-size: 1.7rem; }
      .edition { font-size: .875rem; }
      .toolbar { grid-template-columns: 1fr; gap: 20px; }
      select { max-width: none; }
      .centre-field { grid-column: 1; grid-row: 2; justify-self: stretch; max-width: none; }
      .months { grid-column: 1; grid-row: 3; justify-self: stretch; justify-content: space-between; }
      .month-label { width: auto; }
      .map-area { padding: 4px; }
      #status { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="masthead">
        <img class="copernicus" src="logos/CopernicusLogo.png" alt="Copernicus — Europe's eyes on Earth" width="1138" height="270">
        <div class="heading">
          <h1>Seasonal Forecasts</h1>
          <p class="edition" id="edition">Loading forecast edition…</p>
        </div>
        <img class="brand" src="logos/brand-logo.png" alt="Ιπτάμενο Σαπούνι" width="1254" height="1254">
      </div>
    </header>
    <section aria-label="Forecast maps">
      <div class="toolbar">
        <div class="field">
          <label for="variable">Variable</label>
          <select id="variable">
            <option value="mm">Precipitation</option>
            <option value="MSLP">Mean sea level pressure</option>
            <option value="Snowfall-Precipitation">Snowfall</option>
            <option value="T2m">Temperature</option>
            <option value="Z500">Geopotential height at 500 hPa</option>
          </select>
        </div>
        <nav class="months" aria-label="Forecast month">
          <button id="previous" type="button" aria-label="Previous month" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
          </button>
          <div class="month-label" aria-live="polite" aria-atomic="true">
            <span id="month">—</span>
            <span id="position">—</span>
          </div>
          <button id="next" type="button" aria-label="Next month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
          </button>
        </nav>
        <div class="field centre-field">
          <label for="centre">Forecasting centre</label>
          <select id="centre">
            <option value="AVERAGE">AVERAGE</option>
            <option value="ECMWF">ECMWF</option>
            <option value="UKMO">UK Met Office (UKMO)</option>
            <option value="NCEP">NCEP</option>
            <option value="METEO_FRANCE">Météo-France</option>
            <option value="DWD">DWD</option>
            <option value="ECCC">ECCC</option>
            <option value="CMCC">CMCC (Italy)</option>
            <option value="BOM">BOM (Australia)</option>
            <option value="JMA">JMA (Japan)</option>
          </select>
        </div>
      </div>
      <figure aria-busy="true" id="figure">
        <div class="map-area" id="map-area">
          <p id="status" role="status">Loading forecast map…</p>
          <img id="map" alt="" hidden>
        </div>
        <figcaption id="caption">Seasonal forecast anomalies</figcaption>
      </figure>
      <noscript>Please enable JavaScript to select variables and browse the forecast maps.</noscript>
    </section>
  </main>
  <script>
    'use strict';
    // The plotter writes images/forecast-config.json and a compatible JS copy.
    const IMAGE_FOLDER = 'images/';
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];
    let FORECAST_RUN = '';
    let MONTHS = [];
    let initializationLabel = '';
    let config = null;
    const variable = document.getElementById('variable');
    const centre = document.getElementById('centre');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    const status = document.getElementById('status');
    const figure = document.getElementById('figure');
    let displayedImage = document.getElementById('map');
    let monthIndex = 0;
    let requestNumber = 0;

    function render() {
      const request = ++requestNumber;
      const month = MONTHS[monthIndex];
      const variableLabel = variable.options[variable.selectedIndex].text;
      const centreLabel = centre.options[centre.selectedIndex].text;
      const filename = `${centre.value}_${variable.value}_LT${month.lead}_${month.name}_${FORECAST_RUN}.png`;
      const record = config.files ? config.files[filename] : null;
      let sourceLabel = centreLabel;
      if (centre.value === 'AVERAGE' && record && Array.isArray(record.contributing_centres)) {
        const contributors = record.contributing_centres;
        sourceLabel = `AVERAGE (${contributors.length} ${contributors.length === 1 ? 'centre' : 'centres'}: ${contributors.join(', ')})`;
      }
      const description = `${sourceLabel} · ${variableLabel} anomaly · ${month.name} ${month.year}`;
      document.getElementById('month').textContent = `${month.name} ${month.year}`;
      document.getElementById('position').textContent = `${monthIndex + 1} / ${MONTHS.length}`;
      document.getElementById('caption').textContent = description;
      previous.disabled = monthIndex === 0;
      next.disabled = monthIndex === MONTHS.length - 1;
      displayedImage.hidden = true;
      status.hidden = false;
      status.textContent = 'Loading forecast map…';
      figure.setAttribute('aria-busy', 'true');
      if (config.files && !Object.prototype.hasOwnProperty.call(config.files, filename)) {
        status.textContent = `No ${variableLabel.toLowerCase()} map from ${centreLabel} is available for ${month.name} ${month.year} in this forecast edition. Please select another centre, variable, or month.`;
        figure.setAttribute('aria-busy', 'false');
        return;
      }
      // Use a separate image per request so rapid selections cannot show an old map.
      const pendingImage = new Image();
      pendingImage.id = 'map';
      pendingImage.alt = `${description}. Forecast initialized ${initializationLabel}.`;
      pendingImage.onload = () => {
        if (request !== requestNumber) return;
        displayedImage.replaceWith(pendingImage);
        displayedImage = pendingImage;
        status.hidden = true;
        figure.setAttribute('aria-busy', 'false');
      };
      pendingImage.onerror = () => {
        if (request !== requestNumber) return;
        status.textContent = `The ${variableLabel.toLowerCase()} map from ${centreLabel} for ${month.name} ${month.year} is unavailable. Please try another month, variable, or forecasting centre.`;
        figure.setAttribute('aria-busy', 'false');
      };
      pendingImage.src = IMAGE_FOLDER + filename
        + (config.revision ? `?v=${encodeURIComponent(config.revision)}` : '');
    }
    variable.addEventListener('change', () => { monthIndex = 0; render(); });
    centre.addEventListener('change', render);
    previous.addEventListener('click', () => { if (monthIndex > 0) { monthIndex--; render(); } });
    next.addEventListener('click', () => { if (monthIndex < MONTHS.length - 1) { monthIndex++; render(); } });
    // Reserve a stable map area, fitted to the viewport without cropping.
    // Measure element heights, not scroll-relative positions, to avoid page jumps.
    function fitMap() {
      const main = document.querySelector('main');
      const style = getComputedStyle(main);
      const occupied = document.querySelector('header').offsetHeight
        + document.querySelector('.toolbar').offsetHeight
        + document.getElementById('caption').offsetHeight
        + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom) + 4;
      document.getElementById('map-area').style.setProperty(
        '--map-height', `${Math.max(280, Math.floor(window.innerHeight - occupied))}px`
      );
    }
    window.addEventListener('resize', fitMap);
    window.addEventListener('load', fitMap);
    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(fitMap);
      ['header', '.toolbar', '#caption'].forEach(selector => {
        observer.observe(document.querySelector(selector));
      });
    }
    async function loadForecastConfig() {
      if (window.location.protocol !== 'file:') {
        const response = await fetch(`${IMAGE_FOLDER}forecast-config.json?v=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) return response.json();
        if (response.status !== 404) throw new Error(`configuration HTTP ${response.status}`);
      }
      // Older deployments and local file previews can still use the JS copy.
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `${IMAGE_FOLDER}forecast-config.js?v=${Date.now()}`;
        script.onload = resolve;
        script.onerror = () => reject(new Error('configuration unavailable'));
        document.head.appendChild(script);
      });
      return window.SEASONAL_FORECAST_CONFIG;
    }

    function setCentreOptions(centres) {
      if (!centres || typeof centres !== 'object' || Array.isArray(centres)) return;
      const options = Object.entries(centres)
        .filter(([code, label]) => /^[A-Z0-9_]+$/.test(code) && typeof label === 'string' && label.trim())
        .map(([code, label]) => new Option(label, code));
      if (!options.length) return;
      centre.replaceChildren(...options);
      centre.value = options.some(option => option.value === 'AVERAGE') ? 'AVERAGE' : options[0].value;
    }

    async function start() {
      variable.disabled = true;
      centre.disabled = true;
      previous.disabled = true;
      next.disabled = true;
      try {
        config = await loadForecastConfig();
        if (!config || typeof config.run !== 'string' || !/^\d{6}$/.test(config.run)) {
          throw new Error('invalid initialization');
        }
        const year = Number(config.run.slice(0, 4));
        const initMonth = Number(config.run.slice(4));
        if (year < 1900 || initMonth < 1 || initMonth > 12) throw new Error('invalid initialization');
        const leads = config.leads || [1, 2, 3, 4, 5, 6];
        if (!Array.isArray(leads) || !leads.length
            || leads.some(lead => !Number.isInteger(lead) || lead < 1 || lead > 120)) {
          throw new Error('invalid leads');
        }
        if (config.files !== undefined && (!config.files || typeof config.files !== 'object' || Array.isArray(config.files))) {
          throw new Error('invalid map list');
        }
        FORECAST_RUN = config.run;
        initializationLabel = `${MONTH_NAMES[initMonth - 1]} ${year}`;
        MONTHS = [...new Set(leads)].sort((a, b) => a - b).map(lead => {
          const absoluteMonth = year * 12 + initMonth - 1 + lead - 1;
          return { lead, name: MONTH_NAMES[absoluteMonth % 12], year: Math.floor(absoluteMonth / 12) };
        });
        const first = MONTHS[0];
        const last = MONTHS[MONTHS.length - 1];
        document.getElementById('edition').textContent = `Multi-centre forecast · ${initializationLabel} initialization · ${first.name} ${first.year} – ${last.name} ${last.year}`;
        document.querySelector('meta[name="description"]').content = `Seasonal forecast anomalies initialized ${initializationLabel}, valid ${first.name} ${first.year} to ${last.name} ${last.year}.`;
        setCentreOptions(config.centres);
        variable.disabled = false;
        centre.disabled = false;
        render();
      } catch (error) {
        document.getElementById('edition').textContent = 'Forecast edition unavailable';
        status.hidden = false;
        status.textContent = 'The forecast configuration is missing or invalid. Please try again later.';
        figure.setAttribute('aria-busy', 'false');
        console.error('Seasonal forecast configuration:', error);
      }
      fitMap();
    }
    fitMap();
    start();
  </script>
<!-- Republish GitHub Pages -->
</body>
</html>
